<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формула успеха: плюс логика, минус стресс</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
  .hidden { display: none !important; }
  
  body { background: linear-gradient(145deg, #1e1e2f 0%, #2a2a40 100%); min-height: 100vh; margin: 0; padding: 20px; color: #e0e0ff; display: flex; justify-content: center; }
  .app { max-width: 1150px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border-radius: 48px; padding: 28px 32px; box-shadow: 0 25px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); min-height: calc(100vh - 40px); }
  
  h1.site-title { font-size: 2.1rem; font-weight: 700; background: linear-gradient(to right, #c7b9ff, #80deea, #6effb0); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0 0 8px 0; text-align: center; line-height: 1.3; }
  .subtitle { text-align: center; color: #b0b0d0; margin-bottom: 24px; font-size: 1.1rem; border-bottom: 1px dashed #3f3f60; padding-bottom: 16px; }
  
  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
  .subject-card { background: linear-gradient(135deg, #2a2a4a, #1e1e33); border-radius: 32px; padding: 40px 30px; border: 2px solid #4a4a72; text-align: center; cursor: pointer; transition: 0.2s; }
  .subject-card:hover { transform: translateY(-4px); border-color: #80deea; }
  .subject-card .icon { font-size: 4rem; margin-bottom: 12px; }
  .subject-card .title { font-size: 1.8rem; font-weight: 700; color: #c7b9ff; margin-bottom: 12px; }
  .subject-card .desc { color: #a0a0c0; font-size: 1rem; }
  .subject-card .submenu { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px dashed #4a4a72; flex-direction: column; gap: 10px; }
  .subject-card.open .submenu { display: flex; }
  .subject-card .submenu a { background: #2e2e4a; color: #e0e0ff; text-decoration: none; padding: 12px 20px; border-radius: 40px; border: 2px solid #4a4a72; font-weight: 500; transition: 0.15s; }
  .subject-card .submenu a:hover { background: #5b4b8a; border-color: #80deea; color: white; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .btn { background: #4f3f8a; border: none; color: white; padding: 14px 32px; border-radius: 50px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.15s; box-shadow: 0 7px 0 #1e1835; border: 1px solid #8c7be0; text-decoration: none; display: inline-block; }
  .btn:hover { background: #6252a5; transform: translateY(-2px); }
  .btn-secondary { background: #3a3a5c; box-shadow: 0 7px 0 #14141f; border-color: #5f5f92; }
  .page-title { font-size: 1.8rem; font-weight: 600; color: #e2dcff; margin-bottom: 20px; }
  
  .topic-list { display: flex; flex-direction: column; gap: 14px; }
  .topic-item { background: #232338; border-radius: 20px; overflow: hidden; border: 1px solid #3b3b5a; }
  .topic-header { padding: 18px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 1.15rem; font-weight: 600; color: #e2dcff; transition: 0.15s; }
  .topic-header:hover { background: #2a2a4a; }
  .topic-header .arrow { transition: transform 0.2s; color: #80deea; }
  .topic-item.open .topic-header .arrow { transform: rotate(90deg); }
  
  .topic-body { display: none; padding: 4px 24px 20px; flex-direction: column; gap: 10px; }
  .topic-item.open .topic-body { display: flex; }
  .topic-body a { background: #1e1e33; color: #cfcaff; text-decoration: none; padding: 12px 20px; border-radius: 14px; border: 1px solid #4a4a72; font-weight: 500; display: flex; align-items: center; gap: 10px; transition: 0.15s; }
  .topic-body a:hover { background: #3e3e62; border-color: #80deea; color: white; }
  
  .empty-note { text-align: center; color: #7b7ba3; padding: 40px; font-style: italic; font-size: 1.1rem; }
  .loader { text-align: center; font-size: 1.2rem; color: #80deea; padding: 40px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .file-view { background: #1a1a2c; border-radius: 20px; overflow: hidden; border: 1px solid #4a4a72; height: 80vh; }
  .file-view iframe { width: 100%; height: 100%; border: none; background: #1e1e2f; }
</style>
</head>
<body>
<div class="app">
  <div data-page="home">
    <h1 class="site-title">Формула успеха: плюс логика, минус стресс</h1>
    <div class="subtitle">выберите предмет</div>
    <div class="main-grid">
      <div class="subject-card" id="cardMath">
        <div class="icon">📐</div>
        <div class="title">Математика</div>
        <div class="desc">Выберите раздел</div>
        <div class="submenu" id="mathMenu"></div>
      </div>
      <div class="subject-card" id="cardInf">
        <div class="icon">💻</div>
        <div class="title">Информатика</div>
        <div class="desc">Выберите раздел</div>
        <div class="submenu" id="infMenu"></div>
      </div>
    </div>
  </div>

  <div data-page="class-page" class="hidden">
    <div class="topbar">
      <div class="page-title" id="classTitle">Загрузка...</div>
      <div>
        <button class="btn btn-secondary" onclick="goto('home')">🏠 Главная</button>
      </div>
    </div>
    <div class="topic-list" id="classTopics"></div>
  </div>

  <div data-page="file-page" class="hidden">
    <div class="topbar">
      <div class="page-title" id="fileTitle">Загрузка...</div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="backToClass()">← Назад</button>
        <button class="btn" onclick="goto('home')">🏠 Главная</button>
      </div>
    </div>
    <div class="file-view">
      <iframe id="mainIframe" src=""></iframe>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxR6Q33g8B7s6O5FZzqB23AcfXQIw9gmo2S2tiDd7wpyyG2tp9-OtiyU6w0MhXz6NQJww/exec';

let ALL_TOPICS_INFO = []; 
let ALL_TOPICS_MATH = []; 
let CURRENT_SUBJECT = ''; 
let CURRENT_PARALLEL = '';

// Флаг загрузки и обещание (чтобы ждать, если ученик нажал быстро)
let isLoaded = false;
let loadPromise = null;

const pages = document.querySelectorAll('[data-page]');
function goto(pageId) {
  pages.forEach(p => {
    if (p.dataset.page === pageId) p.classList.remove('hidden');
    else p.classList.add('hidden');
  });
  window.scrollTo(0, 0);
}

document.body.addEventListener('click', (e) => {
  if (e.target.closest('.submenu a')) return; 
  const card = e.target.closest('.subject-card');
  if (card) {
    document.querySelectorAll('.subject-card.open').forEach(c => { if (c !== card) c.classList.remove('open'); });
    card.classList.toggle('open');
  }
});

function buildMenus() {
  const classes = ['5', '6', '7', '8', '9', '10', '11'];
  
  let infHtml = classes.map(c => `<a href="#" onclick="openClass('Информатика', '${c}')">${c} класс</a>`).join('');
  infHtml += `<a href="#" onclick="openClass('Информатика', 'Олимпиадная')" style="border-color:#ffe484; color:#ffe484;">🏆 Олимпиадная</a>`;
  document.getElementById('infMenu').innerHTML = infHtml;

  let mathHtml = classes.map(c => `<a href="#" onclick="openClass('Математика', '${c}')">${c} класс</a>`).join('');
  mathHtml += `<a href="#" onclick="openClass('Математика', 'Олимпиадная')" style="border-color:#ffe484; color:#ffe484;">🏆 Олимпиадная</a>`;
  document.getElementById('mathMenu').innerHTML = mathHtml;
}

async function loadTopics() {
  if (isLoaded) return;
  loadPromise = fetch(`${BACKEND_URL}?action=getTopics`)
    .then(resp => resp.json())
    .then(data => {
      if (data.ok) {
        ALL_TOPICS_INFO = data.topics.filter(t => t.subject.toLowerCase().includes('информ'));
        ALL_TOPICS_MATH = data.topics.filter(t => t.subject.toLowerCase().includes('матем'));
      }
      isLoaded = true;
    })
    .catch(e => {
      console.log('Ошибка загрузки:', e);
      isLoaded = true; // Чтобы не зависало навсегда
    });
}

async function openClass(subject, par) {
  CURRENT_SUBJECT = subject;
  CURRENT_PARALLEL = par;
  
  const displayPar = par === 'Олимпиадная' ? 'Олимпиадная' : `${par} класс`;
  document.getElementById('classTitle').innerText = `${subject} · ${displayPar}`;
  
  const container = document.getElementById('classTopics');
  container.innerHTML = '<div class="loader">Загрузка тем... Пожалуйста, подождите.</div>';
  goto('class-page');

  // Ждем завершения загрузки данных (если оно еще идет)
  if (!isLoaded) {
    await loadPromise;
  }

  // Теперь данные точно есть, рисуем
  renderClassContent(container, subject, par);
}

function renderClassContent(container, subject, par) {
  const db = subject === 'Информатика' ? ALL_TOPICS_INFO : ALL_TOPICS_MATH;
  const filtered = db.filter(t => t.parallel === par);
  
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-note">Для раздела "${par}" пока нет тем.</div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(t => {
    if (!grouped[t.topicName]) grouped[t.topicName] = [];
    grouped[t.topicName].push(t);
  });

  container.innerHTML = Object.keys(grouped).map(topicName => {
    const levels = grouped[topicName];
    return `
      <div class="topic-item">
        <div class="topic-header" onclick="this.parentElement.classList.toggle('open')">
          ${topicName} <span class="arrow">▸</span>
        </div>
        <div class="topic-body">
          ${levels.map(l => `
            <a href="#" onclick="openFile('${l.levelName}', '${l.file}')">
              📄 ${l.levelName}
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function openFile(topicName, fileName) {
  document.getElementById('fileTitle').innerText = topicName;
  const iframe = document.getElementById('mainIframe');
  iframe.src = fileName;
  goto('file-page');
}

function backToClass() {
  if (CURRENT_SUBJECT && CURRENT_PARALLEL) openClass(CURRENT_SUBJECT, CURRENT_PARALLEL);
  else goto('home');
}

// Запуск
buildMenus();   
loadTopics();   
goto('home');
</script>
</body>
</html>
