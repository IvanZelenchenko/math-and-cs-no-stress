<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Самостоятельная работа</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
  body { background: linear-gradient(145deg, #1e1e2f 0%, #2a2a40 100%); min-height: 100vh; margin: 0; padding: 20px; color: #e0e0ff; display: flex; justify-content: center; }
  .app { max-width: 850px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border-radius: 48px; padding: 28px 32px; box-shadow: 0 25px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); }
  
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .breadcrumb { color: #a0a0c0; font-size: 0.95rem; }
  .breadcrumb a { color: #80deea; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  
  h1 { text-align: center; background: linear-gradient(to right, #c7b9ff, #80deea); -webkit-background-clip: text; color: transparent; font-size: 2rem; margin-bottom: 10px; }
  .subtitle { text-align: center; color: #b0b0d0; margin-bottom: 24px; border-bottom: 1px dashed #3f3f60; padding-bottom: 16px; }
  .card { background: rgba(20,20,35,0.7); border-radius: 24px; padding: 24px; margin-bottom: 20px; border: 1px solid #3b3b5a; }
  
  .btn { background: #4f3f8a; border: none; color: white; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 5px 0 #1e1835; }
  .btn:hover { background: #6252a5; }
  .btn-success { background: #2e7d5e; box-shadow: 0 5px 0 #10462f; }
  .btn-success:hover { background: #3e9d6e; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  .timer-bar { display: flex; justify-content: space-between; background: #2a2a4a; border-radius: 20px; padding: 14px 22px; margin-bottom: 20px; border: 2px solid #4a4a72; }
  .timer { font-family: monospace; font-size: 1.6rem; font-weight: 700; color: #6effb0; }
  
  .sa-question { background: #1e1e33; border-radius: 24px; padding: 22px 26px; margin-bottom: 22px; border-left: 6px solid #80deea; color: #e8e4ff; }
  .sa-question h3 { margin: 0 0 12px; color: #b0e0ff; font-size: 1.15rem; }
  .sa-question .expr-box { font-family: monospace; font-size: 1.3rem; padding: 12px; background: #14141f; border-radius: 12px; margin: 10px 0; text-align: center; color: #ffe484; font-weight: bold; border: 1px solid #3b3b5a; }
  
  .sa-input { width: 80px; padding: 10px; font-size: 1.2rem; text-align: center; background: #2f2f50; border: 2px solid #6b6b9a; border-radius: 12px; color: #ffe484; font-weight: bold; font-family: monospace; }
  .opts { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
  .opts button { background: #2e2e4a; border: 2px solid #4a4a72; color: #e8e4ff; padding: 10px 22px; border-radius: 40px; cursor: pointer; }
  .opts button.selected { background: #5b4b8a; border-color: #80deea; color: white; }
  
  .result-card { background: linear-gradient(135deg, #1e2e2a, #2a2a40); border: 3px solid #6effb0; border-radius: 32px; padding: 32px; text-align: center; }
  .grade { font-size: 5rem; font-weight: 800; background: linear-gradient(to right, #ffe484, #6effb0); -webkit-background-clip: text; color: transparent; margin: 12px 0; }
  
  .review-block { margin-top: 20px; text-align: left; background: #14141f; padding: 15px; border-radius: 15px; border: 1px solid #3b3b5a; }
  .review-item { padding: 10px; border-bottom: 1px solid #2a2a40; display: flex; justify-content: space-between; }
  .review-item.ok { color: #6effb0; }
  .review-item.fail { color: #ff8a9b; }
  
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="breadcrumb">🏠 <a href="index.html">Главная</a> / Информатика / Алгебра логики / СР</div>
    <a href="index.html" class="btn">🏠 Главная</a>
  </div>

  <h1>Самостоятельная работа</h1>
  <div class="subtitle">Алгебра логики</div>

  <div class="card" id="intro">
    <p>Вам будет предложено <strong>5 заданий</strong>. Время — <strong>10 минут</strong>.</p>
    <p>Повторное прохождение невозможно.</p>
    
    <div style="background: #2a2a4a; padding: 10px; border-radius: 8px; margin: 15px 0; font-size: 0.9rem; color: #ffd966;">
      Введите данные как в журнале. Пример: <b>Иванов Иван</b> и класс <b>5Л</b>
    </div>
    <label>ФИО</label><br>
    <input type="text" id="inpFIO" placeholder="Иванов Иван" style="width:100%; padding:10px; margin:5px 0 15px; background:#2f2f50; color:#ffe484; border:2px solid #6b6b9a; border-radius:10px;"><br>
    <label>Класс</label><br>
    <input type="text" id="inpKlass" placeholder="5Л" style="width:100%; padding:10px; margin:5px 0 15px; background:#2f2f50; color:#ffe484; border:2px solid #6b6b9a; border-radius:10px;"><br>
    <div id="err" style="color:#ff8a9b; margin-bottom:15px;"></div>
    
    <button class="btn btn-success" style="width:100%;" onclick="startTest()">Проверить и начать</button>
  </div>

  <div class="card hidden" id="running">
    <div class="timer-bar">
      <div>📝 Выполнение...</div>
      <div class="timer" id="timerDisplay">10:00</div>
    </div>
    <div id="questionsContainer"></div>
    <button class="btn btn-success" style="width: 100%; margin-top: 15px;" onclick="submitWork(false)">Завершить работу</button>
  </div>

  <div class="hidden" id="result"></div>
</div>

<script>
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxR6Q33g8B7s6O5FZzqB23AcfXQIw9gmo2S2tiDd7wpyyG2tp9-OtiyU6w0MhXz6NQJww/exec';
let studentName = '', studentClass = '';
let questions = [], answers = {}, timeLeft = 600, timerId = null;

async function startTest() {
  const fio = document.getElementById('inpFIO').value.trim();
  const klass = document.getElementById('inpKlass').value.trim().toUpperCase();
  const err = document.getElementById('err');
  err.innerText = '';

  if (fio.length < 5) { err.innerText = 'Введите имя и фамилию полностью.'; return; }
  if (klass.length < 1) { err.innerText = 'Введите ваш класс (например, 5Л).'; return; }

  const btn = event.target;
  btn.disabled = true; btn.innerText = 'Проверяем...';

  try {
    const resp = await fetch(`${BACKEND_URL}?action=checkStudent&fio=${encodeURIComponent(fio)}&klass=${encodeURIComponent(klass)}`);
    const data = await resp.json();
    if (!data.found) {
      err.innerText = 'Ошибка: ученик не найден в списке класса.';
      btn.disabled = false; btn.innerText = 'Проверить и начать';
      return;
    }
  } catch (e) {
    err.innerText = 'Ошибка сети. Попробуйте позже.';
    btn.disabled = false; btn.innerText = 'Проверить и начать';
    return;
  }

  studentName = fio;
  studentClass = klass;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('running').classList.remove('hidden');
  
  questions = generateQuestions();
  renderQuestions();
  startTimer();
}

function generateQuestions() {
  const bank = [
    { type: 'value', text: 'Вычисли (A ∧ B) при A=1, B=1', ans: '1' },
    { type: 'value', text: 'Вычисли (A ∨ B) при A=0, B=0', ans: '0' },
    { type: 'value', text: 'Вычисли ¬(A ∧ B) при A=1, B=0', ans: '1' },
    { type: 'value', text: 'Вычисли ((A ∧ B) ∨ C) ∧ ¬D при A=1, B=1, C=0, D=1', ans: '0' },
    { type: 'value', text: 'Вычисли ¬(A ∨ B) ∨ (C ∧ D) при A=0, B=1, C=1, D=1', ans: '1' },
    { type: 'value', text: 'Вычисли ((A ∧ ¬B) ∨ C) ∧ D при A=1, B=1, C=0, D=1', ans: '0' },
    { type: 'rows', text: 'Сколько строк в таблице для 3 переменных?', ans: '8' },
    { type: 'rows', text: 'Сколько строк в таблице для 4 переменных?', ans: '16' },
    { type: 'first', text: 'Первое действие в ¬(A ∧ B) ∨ C?', opts: ['∧', '¬', '∨'], ans: '∧' },
    { type: 'first', text: 'Первое действие в (A ∨ B) ∧ ¬C?', opts: ['∨', '¬', '∧'], ans: '∨' },
    { type: 'gost', text: 'Как обозначается конъюнктор?', opts: ['&', '1', 'Кружок'], ans: '&' },
    { type: 'gost', text: 'Как обозначается инвертор?', opts: ['&', '1', 'Кружок'], ans: 'Кружок' },
    { type: 'circuit_calc', text: 'Вычисли значение схемы при A=1, B=0, C=1, D=0:', inputs: {A:1, B:0, C:1, D:0}, expr: '(A ∧ B) ∨ (C ∧ ¬D)', ans: '1' },
    { type: 'circuit_calc', text: 'Вычисли значение схемы при A=1, B=1, C=0, D=0:', inputs: {A:1, B:1, C:0, D:0}, expr: '¬(A ∧ B) ∨ (C ∧ D)', ans: '0' }
  ];
  return bank.sort(() => Math.random() - 0.5).slice(0, 5);
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = questions.map((q, i) => {
    let inputHTML = '';
    if (q.type === 'value' || q.type === 'rows') {
      inputHTML = `<div>Ответ: <input class="sa-input" id="ans_${i}" maxlength="2"></div>`;
    } else if (q.type === 'first' || q.type === 'gost') {
      inputHTML = `<div class="opts">${q.opts.map(o => `<button onclick="selectOpt(this, ${i}, '${o}')">${o}</button>`).join('')}</div>`;
    } else if (q.type === 'circuit_calc') {
      inputHTML = `
        <div class="expr-box">${q.expr}</div>
        <div style="margin: 10px 0; color: #cfcaff;">Входы: A=${q.inputs.A}, B=${q.inputs.B}, C=${q.inputs.C}, D=${q.inputs.D}</div>
        <div>Ответ (0 или 1): <input class="sa-input" id="ans_${i}" maxlength="1"></div>
      `;
    }
    return `<div class="sa-question">
      <h3>Задание ${i+1}</h3>
      <div>${q.text}</div>
      ${inputHTML}
    </div>`;
  }).join('');
}

function selectOpt(btn, qIdx, val) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[qIdx] = val;
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  timeLeft = 600;
  updateTimer();
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerId); submitWork(true); }
  }, 1000);
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  document.getElementById('timerDisplay').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function submitWork(auto) {
  if (timerId) clearInterval(timerId);

  // СТРОГАЯ ПРОВЕРКА: не отправляем, если есть незаполненные текстовые поля
  let emptyFields = false;
  questions.forEach((q, i) => {
    if (q.type === 'value' || q.type === 'rows' || q.type === 'circuit_calc') {
      const val = document.getElementById('ans_' + i).value.trim();
      if (val === '') emptyFields = true;
    }
  });

  if (emptyFields && !auto) {
    alert('Пожалуйста, ответьте на все вопросы (заполните пустые поля) перед завершением.');
    return;
  }

  document.getElementById('running').classList.add('hidden');

  let correctCount = 0;
  let reviewHTML = '';

  questions.forEach((q, i) => {
    let userAns = '';
    if (q.type === 'value' || q.type === 'rows' || q.type === 'circuit_calc') {
      userAns = document.getElementById('ans_' + i).value.trim();
    } else {
      userAns = answers[i] || '';
    }
    
    const isCorrect = (userAns !== '' && userAns === q.ans);
    if (isCorrect) correctCount++;

    reviewHTML += `
      <div class="review-item ${isCorrect ? 'ok' : 'fail'}">
        <span>Вопрос ${i+1}</span>
        <span>Ваш ответ: <b>${userAns || '—'}</b> ${isCorrect ? '✅' : '❌'}</span>
      </div>
    `;
  });

  let grade = '2';
  if (correctCount === 5) grade = '5';
  else if (correctCount === 4) grade = '4';
  else if (correctCount === 3) grade = '3';

  const date = new Date().toLocaleString('ru-RU');
  fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'addResult', fio: studentName, klass: studentClass, topic: 'Алгебра логики', grade: grade, datetime: date, correct: correctCount })
  }).catch(e => console.log('Ошибка отправки', e));

  const res = document.getElementById('result');
  res.classList.remove('hidden');
  res.innerHTML = `
    <div class="result-card">
      <h2>${auto ? '⏱ Время вышло!' : '✅ Работа завершена!'}</h2>
      <p>Правильных ответов: <b>${correctCount} из 5</b></p>
      <div class="grade">${grade}</div>
      <p>Ваша оценка</p>
      
      <div class="review-block">
        <h4 style="margin-top:0; color:#b0e0ff;">Разбор ответов:</h4>
        ${reviewHTML}
      </div>

      <button class="btn" style="margin-top: 20px;" onclick="window.location.href='index.html'">🏠 На главную</button>
    </div>
  `;
}
 // --- УМНЫЙ ПЕРЕХОД ---
async function loadNextButton(currentFile) {
  const container = document.getElementById('nextLevelContainer');
  if (!container) return;
  
  container.innerHTML = '<span style="color:#a0a0c0;">Поиск следующего задания...</span>';
  
  try {
    const resp = await fetch(`${BACKEND_URL}?action=getTopics`);
    const data = await resp.json();
    if (data.ok) {
      const currentTopic = data.topics.find(t => t.file === currentFile);
      
      if (currentTopic && currentTopic.next) {
        container.innerHTML = `<button class="btn btn-success" onclick="window.location.href='${currentTopic.next}'" style="font-size:1.1rem; padding:14px 32px;">Перейти к следующему заданию →</button>`;
      } else {
        container.innerHTML = `<button class="btn" onclick="window.location.href='index.html'" style="font-size:1.1rem; padding:14px 32px; background:#4f3f8a;">Тема изучена, перейти на главную 🏠</button>`;
      }
    }
  } catch (e) {
    container.innerHTML = `<button class="btn" onclick="window.location.href='index.html'">Вернуться на главную</button>`;
  }
}
</script>
</body>
</html>
