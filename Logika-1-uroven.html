<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 уровень. Операции и таблицы</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #1e1e2f; color: #e0e0ff; margin: 0; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { text-align: center; color: #c7b9ff; }
  .card { background: #25253e; padding: 24px; border-radius: 20px; margin-bottom: 20px; border-left: 6px solid #80deea; }
  .question-box { background: #1e1e33; padding: 16px; border-radius: 16px; margin-bottom: 15px; }
  
  .btn { background: #4f3f8a; border: none; color: white; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.15s; }
  .btn:hover { background: #6252a5; }
  .btn-success { background: #2e7d5e; }
  
  .options { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0; }
  .option-btn { background: #2e2e4a; border: 2px solid #4a4a72; color: #e0e0ff; padding: 10px 20px; border-radius: 30px; cursor: pointer; }
  .option-btn:hover { border-color: #80deea; }
  .option-btn.correct { background: #2e7d5e; border-color: #6effb0; }
  .option-btn.wrong { background: #8b3a4a; border-color: #ff8a9b; }
  
  .table-container { overflow-x: auto; margin: 15px 0; background: #1b1b30; border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; text-align: center; font-family: monospace; font-size: 1.1rem; }
  th { background: #34345a; padding: 10px; color: #b9b2ff; }
  td { padding: 10px; border-bottom: 1px solid #35355a; }
  .table-input { width: 50px; padding: 6px; background: #2f2f50; border: 2px solid #4d4d7a; border-radius: 8px; color: #fff; text-align: center; }
  .table-input.correct { border-color: #6effb0; background: #1f4a37; }
  .table-input.wrong { border-color: #ff8a9b; background: #4a1f2a; }
  
  /* Колесо */
  .wheel-wrap { position: relative; width: 300px; height: 300px; margin: 20px auto; }
  .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ffe484; z-index: 10; }
  .wheel-svg { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1); }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #2e2e4a; border: 3px solid #ffe484; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe484; font-weight: bold; }
  .wheel-result { text-align: center; font-size: 1.2rem; color: #ffe484; min-height: 2rem; margin-top: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>1 уровень. Операции и таблицы</h1>
  
  <div class="card">
    <h2>1. Вопросы теории</h2>
    <div class="question-box">
      <p>Какая операция даёт истину только когда оба высказывания истинны?</p>
      <div class="options">
        <button class="option-btn" onclick="checkAnswer(this, true)">Конъюнкция (И)</button>
        <button class="option-btn" onclick="checkAnswer(this, false)">Дизъюнкция (ИЛИ)</button>
        <button class="option-btn" onclick="checkAnswer(this, false)">Инверсия (НЕ)</button>
      </div>
    </div>
    <div class="question-box">
      <p>Дизъюнкция (ИЛИ) ложна только когда...</p>
      <div class="options">
        <button class="option-btn" onclick="checkAnswer(this, true)">Оба ложны</button>
        <button class="option-btn" onclick="checkAnswer(this, false)">Одно ложно</button>
        <button class="option-btn" onclick="checkAnswer(this, false)">Оба истинны</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Таблицы истинности</h2>
    <div class="table-container">
      <table>
        <tr><th>A</th><th>B</th><th>A ∧ B</th></tr>
        <tr><td>0</td><td>0</td><td><input class="table-input" data-ans="0"></td></tr>
        <tr><td>0</td><td>1</td><td><input class="table-input" data-ans="0"></td></tr>
        <tr><td>1</td><td>0</td><td><input class="table-input" data-ans="0"></td></tr>
        <tr><td>1</td><td>1</td><td><input class="table-input" data-ans="1"></td></tr>
      </table>
    </div>
    <div class="table-container">
      <table>
        <tr><th>A</th><th>B</th><th>A ∨ B</th></tr>
        <tr><td>0</td><td>0</td><td><input class="table-input" data-ans="0"></td></tr>
        <tr><td>0</td><td>1</td><td><input class="table-input" data-ans="1"></td></tr>
        <tr><td>1</td><td>0</td><td><input class="table-input" data-ans="1"></td></tr>
        <tr><td>1</td><td>1</td><td><input class="table-input" data-ans="1"></td></tr>
      </table>
    </div>
    <div style="text-align: center; margin-top: 15px;">
      <button class="btn btn-success" onclick="checkTables()">Проверить таблицы</button>
      <div id="tableFb" style="margin-top: 10px;"></div>
    </div>
  </div>

  <div class="card">
    <h2>3. Колесо Фортуны</h2>
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 300 300"></svg>
      <div class="wheel-center">SPIN</div>
    </div>
    <div style="text-align: center;">
      <button class="btn" onclick="spinWheel()">Крутить колесо</button>
    </div>
    <div class="wheel-result" id="wheelRes"></div>
  </div>

</div>

<script>
function checkAnswer(btn, ok) {
  btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'wrong'));
  btn.classList.add(ok ? 'correct' : 'wrong');
}

function checkTables() {
  let ok = true;
  document.querySelectorAll('.table-input').forEach(inp => {
    if (inp.value.trim() !== inp.dataset.ans) {
      inp.classList.add('wrong'); ok = false;
    } else {
      inp.classList.remove('wrong'); inp.classList.add('correct');
    }
  });
  const fb = document.getElementById('tableFb');
  fb.innerHTML = ok ? '<span style="color:#6effb0">✅ Всё верно!</span>' : '<span style="color:#ff8a9b">💡 Проверь красные поля.</span>';
}

// Колесо
const tasks = ['A ∧ B ∨ C', '¬A ∧ (B ∨ C)', '(A ∨ B) ∧ C', 'A ∧ ¬B ∨ C', '¬(A ∧ B) ∨ C', 'A ∨ B ∧ C', '¬A ∨ B ∧ C', '(A ∧ B) ∨ ¬C', 'A ∧ (B ∨ C)', '¬(A ∨ B ∨ C)'];
let rotation = 0;

function drawWheel() {
  const svg = document.getElementById('wheelSvg');
  let html = '';
  const colors = ['#4f3f8a','#2e7d5e','#8b3a4a','#2e4a7d','#7d6b2e','#5b2e7d','#2e7d7d','#7d4a2e','#3a8b4a','#7d2e5e'];
  for (let i = 0; i < 10; i++) {
    const a0 = (i * 36 - 90) * Math.PI / 180;
    const a1 = ((i + 1) * 36 - 90) * Math.PI / 180;
    const x0 = 150 + 140 * Math.cos(a0), y0 = 150 + 140 * Math.sin(a0);
    const x1 = 150 + 140 * Math.cos(a1), y1 = 150 + 140 * Math.sin(a1);
    html += `<path d="M 150 150 L ${x0} ${y0} A 140 140 0 0 1 ${x1} ${y1} Z" fill="${colors[i]}" stroke="#14141f" stroke-width="2"/>`;
    const am = (a0 + a1) / 2;
    const tx = 150 + 90 * Math.cos(am), ty = 150 + 90 * Math.sin(am);
    html += `<text x="${tx}" y="${ty+5}" text-anchor="middle" fill="#ffe484" font-family="monospace" font-weight="bold" font-size="16">${i+1}</text>`;
  }
  svg.innerHTML = html;
}

function spinWheel() {
  const idx = Math.floor(Math.random() * 10);
  const targetAngle = 360 * 5 - (idx * 36 + 18);
  rotation += targetAngle;
  document.getElementById('wheelSvg').style.transform = `rotate(${rotation}deg)`;
  document.getElementById('wheelRes').innerText = 'Крутим...';
  setTimeout(() => {
    document.getElementById('wheelRes').innerHTML = `🎯 Выпало: <b>${tasks[idx]}</b>`;
  }, 4100);
}

drawWheel();
</script>
</body>
</html>
